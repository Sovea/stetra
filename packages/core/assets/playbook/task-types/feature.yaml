# Feature-specific guidance. Do not repeat core implementation preferences.

- id: feature-start-from-requested-behavior-01
  type: convention
  layer: task-types
  scope: { path: "**/*" }
  prescription: should
  weight: high
  description: "Shape the feature around the requested observable behavior and explicit constraints, not an architecture invented ahead of need."
  rationale: "Feature adoption depends on solving the requested behavior with proportionate structure."
  exceptions:
    - "Clarify structure first when a shared public boundary or critical state machine would make the wrong shape costly to reverse."
  examples:
    - avoid: { code: "Build a generic plugin system for one requested option." }
      good: { code: "Add the requested option at the existing extension point." }
      note: "Let concrete behavior earn structure."

- id: feature-fit-existing-system-01
  type: constraint
  layer: task-types
  scope: { path: "**/*" }
  prescription: must
  weight: critical
  description: "Integrate the feature through sound existing repository boundaries and conventions."
  rationale: "A feature that behaves correctly but bypasses established ownership or extension points raises long-term adoption cost."
  exceptions:
    - "Introduce a new pattern only when the existing boundary cannot satisfy the requirement safely, and make the scoped deviation explicit."
  examples:
    - avoid: { code: "Add a parallel persistence path beside the repository abstraction." }
      good: { code: "Extend the repository's existing persistence boundary." }
      note: "Repository fit is part of feature correctness."

- id: feature-careful-at-boundaries-01
  type: constraint
  layer: task-types
  scope: { path: "**/*" }
  prescription: must
  weight: critical
  rccl_immune: true
  traits:
    safety_critical: true
  description: "Handle feature inputs, state transitions, and side effects deliberately rather than implementing only the happy path."
  rationale: "New behavior creates new failure surfaces; boundary behavior must be part of the feature design."
  exceptions:
    - "Boundary handling may be lighter for a genuinely internal, low-risk surface whose assumptions are explicit."
  examples:
    - avoid: { code: "Persist state before validating the requested transition." }
      good: { code: "Validate the transition, then perform the side effect." }
      note: "Make failure ordering intentional."

- id: feature-include-supporting-work-01
  type: constraint
  layer: task-types
  scope: { path: "**/*" }
  prescription: should
  weight: high
  traits:
    safety_critical: true
  description: "Include tests, validation, error handling, and state handling proportionate to the feature's risk."
  rationale: "Supporting work is part of a usable feature, not optional polish after implementation."
  exceptions:
    - "A deliberately scoped prototype may defer supporting work only through an explicit follow-up."
  examples:
    - avoid: { code: "Add a new command without error-path or behavior coverage." }
      good: { code: "Cover the command's success and task-relevant failure behavior." }
      note: "Scale supporting evidence with risk."
