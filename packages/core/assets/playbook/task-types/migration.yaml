# Migration-specific guidance. Migrations may legitimately approach the byte ceiling.

- id: migration-optimize-for-safe-transition-01
  type: constraint
  layer: task-types
  scope: { path: "**/*" }
  prescription: must
  weight: critical
  traits:
    safety_critical: true
    compatibility_sensitive: true
    migration_sensitive: true
  description: "Prefer a reviewable, recoverable transition and stage the migration when partial states can remain coherent."
  rationale: "Migration quality depends on safely crossing between states, not only on the cleanliness of the destination."
  exceptions:
    - "Use a single cutover when source and target cannot safely coexist, and make the risk explicit."
  examples:
    - avoid: { code: "Replace every consumer without a recovery boundary." }
      good: { code: "Move consumers in verifiable steps with a defined rollback point." }
      note: "Optimize the transition path as well as the endpoint."

- id: migration-explicit-source-and-target-01
  type: constraint
  layer: task-types
  scope: { path: "**/*" }
  prescription: should
  weight: high
  traits:
    compatibility_sensitive: true
    migration_sensitive: true
  description: "Make the source state, target state, and migration boundary explicit."
  rationale: "Reviewers cannot judge completeness or compatibility without knowing which old and new patterns are in scope."
  exceptions:
    - "A trivial dependency bump with no API change needs only a concise source/target statement."
  examples:
    - avoid: { code: "Modernize configuration throughout the repository." }
      good: { code: "Move package A from config v1 to v2; packages B and C remain on v1." }
      note: "Bound the transition precisely."

- id: migration-control-compatibility-01
  type: constraint
  layer: task-types
  scope: { path: "**/*" }
  prescription: must
  weight: critical
  rccl_immune: true
  traits:
    safety_critical: true
    compatibility_sensitive: true
    migration_sensitive: true
  description: "State whether compatibility is preserved or intentionally broken, and update affected consumers within that declared boundary."
  rationale: "Implicit compatibility assumptions create hidden partial migrations and unpredictable consumer failures."
  exceptions:
    - "A breaking transition is acceptable when it is explicit, documented, and coordinated with known consumers."
  examples:
    - avoid: { code: "Change a public shape and leave callers to discover the break." }
      good: { code: "Declare the break and update or notify every known consumer in scope." }
      note: "Compatibility is a decision, not an accidental side effect."

- id: migration-keep-verifiable-01
  type: constraint
  layer: task-types
  scope: { path: "**/*" }
  prescription: should
  weight: high
  traits:
    safety_critical: true
    compatibility_sensitive: true
    migration_sensitive: true
  description: "Verify source behavior, target behavior, and boundary transformations at each meaningful migration step."
  rationale: "A migration can appear complete while adapters or data transformations silently lose behavior."
  exceptions:
    - "Final-step validation is acceptable only when intermediate states are intentionally non-functional and cannot be deployed."
  examples:
    - avoid: { code: "Check only that the target compiles." }
      good: { code: "Exercise the source-to-target transformation and affected consumer contract." }
      note: "Verification should cross the same boundary as the migration."

- id: migration-convergent-end-state-01
  type: architecture
  layer: task-types
  scope: { path: "**/*" }
  prescription: should
  weight: high
  traits:
    broad_scope: true
    migration_sensitive: true
  description: "Make each migration step reduce ambiguity between old and new patterns, with temporary structures visibly bounded."
  rationale: "Unbounded coexistence turns migration scaffolding into accidental permanent architecture."
  exceptions:
    - "Multiple patterns may remain when distinct domain needs justify them as intentional long-term design."
  examples:
    - avoid: { code: "Add an adapter with no owner or removal condition." }
      good: { code: "Name the adapter as transitional and define the remaining consumers." }
      note: "Every step should make convergence easier to inspect."
