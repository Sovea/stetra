# Refactor-specific guidance. Core already owns proportionality and repository fit.

- id: refactor-preserve-intended-behavior-01
  type: constraint
  layer: task-types
  scope: { path: "**/*" }
  prescription: must
  weight: critical
  rccl_immune: true
  traits:
    safety_critical: true
    compatibility_sensitive: true
  description: "Preserve externally expected behavior unless a behavior change is explicitly part of the task."
  rationale: "Unintended behavior drift turns a structural change into an unreviewed feature or regression."
  exceptions:
    - "An intended behavior change must be explicit and reviewable as behavior, not hidden inside restructuring."
  examples:
    - avoid: { code: "Change error semantics while extracting a helper." }
      good: { code: "Extract the helper while preserving the observable error contract." }
      note: "Separate structural intent from behavior intent."

- id: refactor-improve-for-real-reason-01
  type: architecture
  layer: task-types
  scope: { path: "**/*" }
  prescription: should
  weight: high
  traits:
    broad_scope: true
  description: "Make the refactor address a concrete structural problem that remains visible in the resulting design."
  rationale: "A refactor without present pressure tends to exchange familiar complexity for speculative complexity."
  exceptions:
    - "Trivially safe mechanical cleanup needs only an obvious local benefit."
  examples:
    - avoid: { code: "Introduce a pattern because it is generally fashionable." }
      good: { code: "Separate responsibilities that currently force unrelated changes together." }
      note: "The new structure should explain the pressure that earned it."

- id: refactor-disciplined-scope-01
  type: constraint
  layer: task-types
  scope: { path: "**/*" }
  prescription: must
  weight: critical
  description: "Limit the refactor to the intended structural improvement and directly necessary cleanup."
  rationale: "Mixing unrelated cleanup or feature work makes behavior preservation and review scope ambiguous."
  exceptions:
    - "Trivially safe cleanup uncovered in the changed unit is acceptable when it is inseparable from the improvement."
  examples:
    - avoid: { code: "Restructure one boundary and rename unrelated APIs." }
      good: { code: "Change the boundary and its affected callers only." }
      note: "Keep the structural claim bounded and testable."

- id: refactor-keep-verifiable-01
  type: constraint
  layer: task-types
  scope: { path: "**/*" }
  prescription: should
  weight: high
  description: "Keep behavior preservation verifiable with existing checks and targeted tests where structural change weakens confidence."
  rationale: "Refactor safety requires evidence that observable behavior survived the structural movement."
  exceptions:
    - "Purely mechanical renames or moves need no new test when existing coverage makes equivalence clear."
  examples:
    - avoid: { code: "Move stateful logic across modules without exercising its contract." }
      good: { code: "Run existing checks and add a focused boundary test where needed." }
      note: "Match new evidence to the risk introduced by structural movement."
