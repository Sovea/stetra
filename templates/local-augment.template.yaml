# Project-local prescriptive guidance using the current Playbook schema.
version: "1.0"

meta:
  name: "my-project"
  extends:
    - "builtin/core"
    - "builtin/languages/typescript"
    - "builtin/task-types/*"

# Override strength or rationale for an existing built-in ID.
overrides:
  - supersedes: "core-smallest-reasonable-change-01"
    prescription: must
    weight: critical
    rationale: "Changes in this project must remain reviewable within the requested boundary."
    exceptions:
      - "Broader work is allowed when a narrow change would be unsafe or structurally dishonest."

# Add project-grounded examples to an existing built-in ID.
augments:
  - id: "core-preserve-local-consistency-01"
    examples:
      - good:
          code: "import { parseConfig } from './config/parse.js';"
        note: "This project uses explicit ESM extensions at runtime boundaries."

# Disable a built-in directive that is wrong for this project.
suppresses:
  - id: "core-comments-only-when-they-carry-meaning-01"
    reason: "Generated protocol modules require field comments for downstream tooling."

# Add truly project-specific prescription. Examples are required.
additions:
  - id: "local-runtime-boundary-01"
    type: architecture
    layer: local
    scope:
      path: "src/runtime/**"
    prescription: must
    weight: critical
    description: "Keep policy decisions inside the Runtime public boundary."
    rationale: "Consumers must not create host-specific policy engines."
    exceptions: []
    examples:
      - good:
          code: "const decision = await compileChange(input);"
        avoid:
          code: "const rules = parsePlaybookInSkill();"
        note: "The Runtime result is shared and inspectable; skill-local interpretation is not."
