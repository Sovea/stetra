# Minimal valid local directive.

- id: local-prefer-explicit-result-01
  type: convention
  layer: local
  scope:
    path: "src/**"
  prescription: should
  weight: normal
  description: "Return an explicit result shape from repository boundary functions."
  rationale: "An explicit shape keeps boundary behavior readable and stable for callers."
  examples:
    - good:
        code: "return { user, permissions };"
      note: "The caller can understand the supported result without reconstructing internal state."
