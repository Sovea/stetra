# Full local directive example. Add under local-augment.yaml `additions:`.

- id: local-public-api-validation-01
  # Stable join key for overrides, evaluation, and trace.
  type: constraint
  layer: local
  scope:
    path: "src/api/**"
  prescription: must
  weight: critical

  description: "Validate untrusted request data before it enters domain code."
  rationale: >
    Static types do not establish runtime input validity. Keeping validation at
    the API boundary prevents malformed state from spreading into trusted code.

  exceptions:
    - "An upstream boundary may satisfy this rule only when its validation contract is explicit and covered by an integration check."

  # A conflict/limit relation cannot soften this directive. Use sparingly.
  rccl_immune: true
  traits:
    safety_critical: true
    compatibility_sensitive: true
    migration_sensitive: false
    broad_scope: false

  examples:
    - avoid:
        code: "const input = request.body as CreateUserInput;"
      good:
        code: "const input = CreateUserSchema.parse(request.body);"
      note: "Parsing converts unknown external data into a trusted internal value through an actual runtime check."
