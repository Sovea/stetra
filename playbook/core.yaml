# Built-in language- and task-agnostic guidance.
# Keep this layer small: host agents already own generic coding judgment.

- id: core-clarity-and-legibility-01
  type: convention
  layer: core
  scope: { path: "**/*" }
  prescription: should
  weight: high
  description: "Choose a direct, legible solution whose complexity is proportionate to the task."
  rationale: "A compact harness should reinforce proportionate implementation choices, not restate every general quality preference an advanced host agent already understands."
  exceptions:
    - "Additional complexity is justified when correctness, safety, or stable repeated reuse creates concrete present pressure."
  examples:
    - avoid: { code: "return createFactory(options).build().run(input)" }
      good: { code: "return processInput(input)" }
      note: "Use indirection only when the current task has earned it."

- id: core-preserve-local-consistency-01
  type: convention
  layer: core
  scope: { path: "**/*" }
  prescription: should
  weight: critical
  description: "Match the repository's established naming, structure, and organization unless that local pattern is the problem being changed."
  rationale: "Repository fit affects adoption and review cost; technically plausible code that introduces a foreign local dialect is still a poor change."
  exceptions:
    - "Deviate when the local pattern is unsafe, deprecated, or explicitly in scope for replacement, and keep the deviation bounded."
  examples:
    - avoid: { code: "Add a new global services layer to a feature-oriented repository." }
      good: { code: "Extend the existing feature-local boundary." }
      note: "Use repository evidence rather than personal architectural taste."

- id: core-smallest-reasonable-change-01
  type: constraint
  layer: core
  scope: { path: "**/*" }
  prescription: should
  weight: critical
  traits:
    compatibility_sensitive: true
  description: "Make the smallest coherent change that fully solves the task without hiding necessary structural work."
  rationale: "Unrelated edits increase risk and review burden, while artificial shims can make a superficially small diff structurally dishonest."
  exceptions:
    - "Expand scope only when a narrower change would be unsafe, misleading, or immediately require repair; add compatibility machinery only for an explicit compatibility boundary."
  examples:
    - avoid: { code: "Fix one defect while renaming unrelated APIs and adding an unrequested adapter." }
      good: { code: "Change the defective path and its directly supporting test." }
      note: "Contain the change, but do not optimize for line count at the expense of honesty."

- id: core-handle-failures-and-edge-cases-carefully-01
  type: constraint
  layer: core
  scope: { path: "**/*" }
  prescription: should
  weight: critical
  rccl_immune: true
  traits:
    safety_critical: true
  description: "Handle task-relevant failure modes, assumptions, and boundary cases explicitly enough to preserve safe behavior."
  rationale: "Happy-path code is incomplete when realistic boundary behavior can produce a different and worse result."
  exceptions:
    - "Checks may be lighter only at a genuinely controlled boundary whose assumptions remain explicit."
  examples:
    - avoid: { code: "Assume parsed external input already has the required shape." }
      good: { code: "Validate the boundary before using the value internally." }
      note: "Match defensive work to the concrete boundary and risk."
