# TypeScript-specific deltas. Generic clarity and proportionality live in core.

- id: ts-explicit-public-interfaces-01
  type: constraint
  layer: languages
  scope: { path: "**/*.{ts,tsx}" }
  prescription: should
  weight: high
  traits:
    compatibility_sensitive: true
  description: "Keep exported TypeScript contracts explicit and avoid leaking implementation details into public types."
  rationale: "Public inferred shapes can change accidentally with implementation details and silently couple consumers to internals."
  exceptions:
    - "Simple private or module-internal functions may use stable, obvious inferred return types."
  examples:
    - avoid: { code: "export function load() { return internalState; }" }
      good: { code: "export function load(): PublicState { return toPublicState(internalState); }" }
      note: "Make the intended consumer contract deliberate."

- id: ts-honest-and-precise-types-01
  type: constraint
  layer: languages
  scope: { path: "**/*.{ts,tsx}" }
  prescription: should
  weight: critical
  rccl_immune: true
  traits:
    safety_critical: true
  description: "Model nullability and variants honestly; narrow unknown values instead of bypassing the type system with unjustified any or assertions."
  rationale: "Assertions can create the appearance of safety while discarding the compiler's evidence about runtime possibilities."
  exceptions:
    - "Use an escape hatch only at an unavoidable untyped boundary and validate or document the boundary immediately."
  examples:
    - avoid: { code: "const event = input as KnownEvent;" }
      good: { code: "if (isKnownEvent(input)) handle(input);" }
      note: "Establish runtime reality before claiming a narrower type."

- id: ts-respect-runtime-boundaries-01
  type: constraint
  layer: languages
  scope: { path: "**/*.{ts,tsx}" }
  prescription: should
  weight: critical
  rccl_immune: true
  traits:
    safety_critical: true
  description: "Validate untrusted runtime values at external boundaries; TypeScript declarations alone do not validate network, environment, or user input."
  rationale: "Static types disappear at runtime and cannot establish the shape of values supplied by uncontrolled systems."
  exceptions:
    - "Validation may be lighter across a genuinely internal, atomically deployed typed boundary when that assumption is explicit."
  examples:
    - avoid: { code: "const config: Config = JSON.parse(raw);" }
      good: { code: "const config = ConfigSchema.parse(JSON.parse(raw));" }
      note: "Cross from unknown external data to trusted internal data through a real check."
