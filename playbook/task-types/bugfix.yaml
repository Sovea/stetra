# Bugfix-specific guidance. Core already owns clarity, repository fit, and scope.

- id: bugfix-fix-the-real-problem-01
  type: constraint
  layer: task-types
  scope: { path: "**/*" }
  prescription: must
  weight: critical
  traits:
    safety_critical: true
  description: "Confirm and fix the actual defect rather than changing only its visible symptom."
  rationale: "A plausible patch that leaves the failure mechanism intact creates repeat corrections and false confidence."
  exceptions:
    - "A documented temporary symptom patch is acceptable only for an active incident with an explicit root-cause follow-up."
  examples:
    - avoid: { code: "Catch and ignore the error without correcting the invalid state." }
      good: { code: "Correct the state transition that produces the error." }
      note: "Tie the implementation to the demonstrated failure mode."

- id: bugfix-narrow-change-surface-01
  type: constraint
  layer: task-types
  scope: { path: "**/*" }
  prescription: must
  weight: critical
  description: "Keep a bugfix bounded to the defect and its necessary support; do not mix in unrelated cleanup or redesign."
  rationale: "A focused defect change is easier to verify and less likely to introduce adjacent regressions."
  exceptions:
    - "Broaden the change only when the defect demonstrates that a narrow patch would be unsafe or immediately fragile."
  examples:
    - avoid: { code: "Fix pagination while reorganizing unrelated modules." }
      good: { code: "Correct the pagination calculation and update its regression test." }
      note: "Let a structural cause expand scope only as far as the defect requires."

- id: bugfix-preserve-adjacent-behavior-01
  type: constraint
  layer: task-types
  scope: { path: "**/*" }
  prescription: should
  weight: critical
  rccl_immune: true
  traits:
    safety_critical: true
    compatibility_sensitive: true
  description: "Correct the defect without changing adjacent behavior that is outside the demonstrated bug surface."
  rationale: "A fix that introduces a regression has moved rather than resolved the failure."
  exceptions:
    - "When shared code is the defect source, audit the affected consumers and make any intended behavior change explicit."
  examples:
    - avoid: { code: "Change the shared default while fixing one caller." }
      good: { code: "Preserve the default and correct the defective caller path." }
      note: "Treat compatibility impact as part of bug verification."

- id: bugfix-add-supporting-validation-01
  type: constraint
  layer: task-types
  scope: { path: "**/*" }
  prescription: should
  weight: high
  traits:
    safety_critical: true
  description: "Add or update a targeted test that fails for the defect and protects the corrected behavior."
  rationale: "A regression test turns the diagnosed failure mode into durable, inspectable evidence."
  exceptions:
    - "During an active incident, the test may follow immediately after mitigation but before the fix is considered complete."
  examples:
    - avoid: { code: "Change production logic with no reproduction of the defect." }
      good: { code: "Add a focused failing case, then make it pass with the fix." }
      note: "Test the failure mechanism rather than incidental implementation detail."
